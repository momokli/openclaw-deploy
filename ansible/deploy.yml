---
# Native OpenClaw Config-Converge (Source-of-Truth = dieses Repo).
#
# Bringt die prod-Config auf .149 idempotent auf den Stand von main (git):
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
#
# KEIN Docker mehr: der Gateway läuft nativ als systemd-USER-Service
# (`openclaw-gateway.service`, User momo, Port 18789). Config-Runtime-Pfad ist
# `~/.openclaw/openclaw.json`, Secrets liegen nativ als `~/.openclaw/.env`.
#
# ── Config-Merge-Ansatz (WICHTIG) ─────────────────────────────────────────────
# OpenClaw MUTIERT seine Runtime-Config beim Start: `~/.openclaw/openclaw.json`
# enthält zusätzlich zu den deklarativen Feldern aus git u. a.:
#   auth.profiles / auth.order        (Model-Auth, z. B. deepseek:manual)
#   plugins.entries / plugins.enabled (installierte/aktivierte Plugins)
#   meta.migrations                   (Startup-Legacy-Key-Migrationen)
#   agents.entries.<id>.{agentDir,identity,name}  (auto-generierte Identity)
#   skills.entries["gh-issues"].apiKey (frischer Token, ghs_…/PAT)
#
# Ein blindes copy/install der git-Config über die Runtime-Config würde diese
# Felder LÖSCHEN und von OpenClaw zusätzlich als "accidental clobber" abgelehnt
# (Doku: Writes, die die Datei um >50 % schrumpfen, werden blockiert).
#
# Deshalb convergen wir NICHT per `copy`, sondern über
# `scripts/converge-openclaw-config.sh`: git-Config ist Source-of-Truth für alle
# deklarativen Felder, eine kleine explizite Deny-Liste übernimmt die
# Runtime-Felder aus der bestehenden Config. Das Ergebnis wird atomar (temp+mv)
# mit owner momo/mode 600 geschrieben; der Gateway hot-reloadt/restartet nur bei
# echter (semantischer) Änderung.

- hosts: openclaw
  gather_facts: yes

  vars:
    run_user: momo
    deploy_dir: /opt/apps/openclaw # Host-Staging (Secrets + Scripts + git-Config)
    state_dir: "{{ ansible_user_dir }}/.openclaw" # = /home/momo/.openclaw
    bin_dir: "{{ ansible_user_dir }}/.local/bin" # Bot-Wrappers (clanker-gh/…) on PATH
    gateway_service: openclaw-gateway.service
    gateway_port: 18789
    # Automations sind Runtime-Cron (NICHT in openclaw.json, docs/automations.md).
    # `scripts/automations-apply.sh` legt sie idempotent, aber `--disabled` an
    # (planet-Routing noch nicht verifiziert). Opt-in via -e apply_automations=true.
    apply_automations: false

  tasks:
    # ── Staging: deklarative Dateien + Helper-Scripts auf den Host ──────────

    - name: Create staging directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      become: yes
      loop:
        - "{{ deploy_dir }}/config/agents"
        - "{{ deploy_dir }}/config/automations"
        - "{{ deploy_dir }}/scripts"

    - name: Stage openclaw.json (git)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/openclaw.json"
        dest: "{{ deploy_dir }}/config/openclaw.json"
        mode: "0644"
      become: yes

    - name: Stage agent personas (config/agents/*.md)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/agents/"
        dest: "{{ deploy_dir }}/config/agents/"
        mode: "0644"
      become: yes

    - name: Stage automation prompts (config/automations/*.prompt.md)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/automations/"
        dest: "{{ deploy_dir }}/config/automations/"
        mode: "0644"
      become: yes

    - name: Stage helper scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/{{ item }}"
        dest: "{{ deploy_dir }}/scripts/{{ item }}"
        mode: "0755"
      become: yes
      loop:
        - converge-openclaw-config.sh
        - sync-agent-personas.sh
        - automations-apply.sh

    # Bot-Wrappers müssen auf PATH (~/.local/bin) liegen, weil die Automations-
    # Prompts sie als `clanker-gh`/`claw-git` aufrufen (kein exec host=node).
    # `gh-bot-auth.sh` erwartet `generate-github-token.sh` im selben Verzeichnis.

    - name: Install bot wrappers to ~/.local/bin
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/{{ item }}"
        dest: "{{ bin_dir }}/{{ item }}"
        mode: "0755"
      loop:
        - clanker-gh
        - clanker-git
        - claw-gh
        - claw-git
        - gh-bot-auth.sh
        - generate-github-token.sh

    - name: Ensure jq is installed (config merge)
      ansible.builtin.package:
        name: jq
        state: present
      become: yes

    # ── 1. Config converge (runtime-preserving) ─────────────────────────────

    - name: Converge openclaw.json (preserves runtime fields)
      ansible.builtin.command:
        cmd: "bash {{ deploy_dir }}/scripts/converge-openclaw-config.sh {{ run_user }}"
      become: yes
      register: config_converge
      changed_when: "'status=changed' in config_converge.stdout"

    # ── 2. Secrets: host config/.env → ~/.openclaw/.env ─────────────────────
    # Quelle ist die HOST-Datei `/opt/apps/openclaw/config/.env` (kanonisch,
    # gitignored, enthält alle 8+ Keys inkl. Infra-Keys), NICHT die
    # Control-Machine-Env. Grund: `config/.env` ist laut AGENTS.md DIE
    # Secret-Datei; `~/.openclaw/.env` ist nur eine abgeleitete Kopie, die
    # OpenClaw liest. `copy` ist idempotent und non-destructive, weil
    # `~/.openclaw/.env` keine eigenständigen Keys enthält (OpenClaw schreibt
    # dort nie). `lineinfile` aus dem Docker-Flow entfällt, weil die Quelle
    # jetzt die komplette Datei ist (statt vieler `lookup('env', …)`-Werte).

    - name: Check host secret file
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/config/.env"
      become: yes
      register: host_env

    - name: Converge secrets (~/.openclaw/.env)
      ansible.builtin.copy:
        src: "{{ deploy_dir }}/config/.env"
        dest: "{{ state_dir }}/.env"
        remote_src: yes
        owner: "{{ run_user }}"
        group: "{{ run_user }}"
        mode: "0600"
      become: yes
      when: host_env.stat.exists

    - name: Warn if host secret file is missing
      ansible.builtin.debug:
        msg: "WARN: {{ deploy_dir }}/config/.env fehlt — Secrets wurden NICHT nach ~/.openclaw/.env synchronisiert."
      when: not host_env.stat.exists

    # ── 3. Personas (config/agents/*.md → per-agent AGENTS.md) ──────────────

    - name: Sync agent personas
      ansible.builtin.command:
        cmd: "bash {{ deploy_dir }}/scripts/sync-agent-personas.sh {{ run_user }}"
      become: yes
      changed_when: false # Script ist idempotent (install -m …)

    # ── 4. Automations (optional, Runtime-cron) ─────────────────────────────

    - name: Converge automations (idempotent, --disabled)
      ansible.builtin.command:
        cmd: "bash {{ deploy_dir }}/scripts/automations-apply.sh"
      changed_when: false
      when: apply_automations | bool

    # ── 5. Gateway-Neustart NUR bei Config-Änderung ─────────────────────────
    # Connection-User ist bereits momo (inventory) → `systemctl --user` direkt
    # als momo. XDG_RUNTIME_DIR muss gesetzt sein (linger aktiviert →
    # /run/user/<uid> existiert), sonst findet systemctl den user-manager nicht.

    - name: Restart gateway (user service)
      ansible.builtin.systemd:
        name: "{{ gateway_service }}"
        scope: user
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_user_uid }}"
      when: config_converge.changed

    # ── 6. Health-Check ─────────────────────────────────────────────────────

    - name: Wait for gateway healthz
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gateway_port }}/healthz"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 2
