---
# Deploy OpenClaw on the home server.
# Prerequisites on the control machine (source of truth = this repo):
#   set -a; source ../.env; set +a    # full secret set, see ../.env.example
#
# Run: ansible-playbook -i inventory.ini deploy.yml

- hosts: openclaw
  gather_facts: yes

  vars:
    deploy_dir: /opt/apps/openclaw
    deepseek_api_key: "{{ lookup('env', 'DEEPSEEK_API_KEY') }}"
    kagi_api_key: "{{ lookup('env', 'KAGI_API') }}"
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    gh_token: "{{ lookup('env', 'GH_TOKEN') }}"
    # GitHub App „momo-bot" — optional, migriert Auth vom persönlichen PAT weg.
    # Solange GH_APP_* leer sind, verhält sich das Playbook exakt wie bisher.
    # Der Private Key liegt auf dem Host (NICHT in .env): ~/.secrets/momo-bot.pem.
    gh_app_id: "{{ lookup('env', 'GH_APP_ID') | default('', true) }}"
    gh_app_installation_id: "{{ lookup('env', 'GH_APP_INSTALLATION_ID') | default('', true) }}"
    groq_api_key: "{{ lookup('env', 'GROQ_API_KEY') }}"
    deepgram_api_key: "{{ lookup('env', 'DEEPGRAM_API_KEY') }}"
    gemini_api_key: "{{ lookup('env', 'GEMINI_API_KEY') }}"
    deploy_token: "{{ lookup('env', 'DEPLOY_TOKEN') }}"
    # Preserve existing token if already deployed, else generate new
    gateway_token: "{{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}"

  tasks:
    # ── Prerequisites ─────────────────────────────────────────────

    - name: Check required env vars
      ansible.builtin.assert:
        that:
          - deepseek_api_key | length > 0
          - kagi_api_key | length > 0
          - telegram_bot_token | length > 0
          - (gh_token | length > 0) or (gh_app_id | length > 0 and gh_app_installation_id | length > 0)
          - groq_api_key | length > 0
          - deepgram_api_key | length > 0
          - gemini_api_key | length > 0
        fail_msg: >
          Missing required environment variables.
          Set all keys from .env.example (DEEPSEEK_API_KEY, KAGI_API,
          TELEGRAM_BOT_TOKEN, GH_TOKEN oder GH_APP_ID+GH_APP_INSTALLATION_ID,
          GROQ_API_KEY, DEEPGRAM_API_KEY, GEMINI_API_KEY) before running.

    # ── Lab repo (mounted into OpenClaw as /lab:ro) ──────────────
    # Canonical remote: git@git.sr.ht:~momoy/lab
    # The container runs as uid 1000, so the repo must be world-readable.

    - name: Ensure git is installed
      ansible.builtin.package:
        name: git
        state: present
      become: yes

    - name: Clone or update lab repo from sourcehut
      ansible.builtin.git:
        repo: git@git.sr.ht:~momoy/lab
        dest: /opt/apps/lab
        update: yes
        version: main
        accept_hostkey: yes
        ssh_opts: "-i /home/momo/.ssh/id_ed25519"
      become: no

    - name: Ensure lab repo is world-readable (container uid 1000)
      ansible.builtin.file:
        path: /opt/apps/lab
        mode: u=rwX,go=rX
        recurse: yes
      become: yes

    # ── Directory structure ───────────────────────────────────────

    - name: Create deploy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      become: yes
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/config"
        - "{{ deploy_dir }}/scripts"

    # ── Obsidian vault (bind-mounted into openclaw + obsidian-sync) ──
    # Populated by the obsidian-sync sidecar (obsidian-headless). Must be
    # writable by uid 1000 (container node user).

    - name: Ensure quill vault directory (uid 1000)
      ansible.builtin.file:
        path: /opt/apps/quill
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      become: yes

    # ── Deploy files ──────────────────────────────────────────────

    - name: Deploy docker-compose.yml
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"
      become: yes

    - name: Deploy openclaw.json
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/openclaw.json"
        dest: "{{ deploy_dir }}/config/openclaw.json"
        mode: "0644"
      become: yes

    - name: Deploy workspace files
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../workspace/{{ item }}"
        dest: "{{ deploy_dir }}/workspace/{{ item }}"
        mode: "0644"
        owner: "1000"
        group: "1000"
      become: yes
      loop:
        - SOUL.md
        - AGENTS.md
        - USER.md
        - MEMORY.md

    - name: Fix workspace ownership for container
      ansible.builtin.file:
        path: "{{ deploy_dir }}/workspace"
        owner: "1000"
        group: "1000"
        recurse: yes
      become: yes

    - name: Deploy agent personas (pipeline agents)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../config/agents/{{ item }}.md"
        dest: "{{ deploy_dir }}/config/agents/{{ item }}.md"
        mode: "0644"
      become: yes
      loop:
        - orchestrator
        - planner
        - setup
        - developer
        - verifier
        - tester
        - reviewer

    - name: Deploy build-and-deploy script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/build-and-deploy.sh"
        dest: "{{ deploy_dir }}/scripts/build-and-deploy.sh"
        mode: "0755"
      become: yes

    - name: Deploy webhook receiver
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/webhook.py"
        dest: "{{ deploy_dir }}/webhook.py"
        mode: "0755"
      become: yes

    - name: Install webhook systemd unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/openclaw-deploy-webhook.service"
        dest: "/etc/systemd/system/openclaw-deploy-webhook.service"
        mode: "0644"
      become: yes
      notify: reload systemd

    - name: Enable webhook receiver
      ansible.builtin.systemd:
        name: openclaw-deploy-webhook.service
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes

    - name: Install systemd build timer
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/openclaw-build.{{ item }}"
        dest: "/etc/systemd/system/openclaw-build.{{ item }}"
        mode: "0644"
      become: yes
      loop:
        - service
        - timer
      notify: reload systemd

    - name: Enable build timer
      ansible.builtin.systemd:
        name: openclaw-build.timer
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes

    - name: Install cost systemd units
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/openclaw-cost.{{ item }}"
        dest: "/etc/systemd/system/openclaw-cost.{{ item }}"
        mode: "0644"
      become: yes
      loop:
        - service
        - timer
      notify: reload systemd

    - name: Enable cost timer
      ansible.builtin.systemd:
        name: openclaw-cost.timer
        enabled: yes
        state: started
        daemon_reload: yes
      become: yes

    # ── Secrets (.env) — preserve existing token if present ───────

    - name: Read existing .env
      ansible.builtin.slurp:
        src: "{{ deploy_dir }}/config/.env"
      register: existing_env
      failed_when: false

    - name: Extract existing gateway token
      ansible.builtin.set_fact:
        existing_token: "{{ existing_env.content | default('') | b64decode | regex_search('OPENCLAW_GATEWAY_TOKEN=(.+)', '\\1') | default([]) | join('') }}"
      when: existing_env.content is defined

    - name: Use existing or new token
      ansible.builtin.set_fact:
        gateway_token: "{{ existing_token if existing_token | length > 0 else gateway_token }}"

    - name: Deploy .env with secrets (non-destructive)
      ansible.builtin.lineinfile:
        path: "{{ deploy_dir }}/config/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: yes
        mode: "0600"
      no_log: true
      loop:
        - { key: DEEPSEEK_API_KEY, value: "{{ deepseek_api_key }}" }
        - { key: KAGI_API, value: "{{ kagi_api_key }}" }
        - { key: TELEGRAM_BOT_TOKEN, value: "{{ telegram_bot_token }}" }
        - { key: OPENCLAW_GATEWAY_TOKEN, value: "{{ gateway_token }}" }
        - { key: GH_TOKEN, value: "{{ gh_token }}" }
        - { key: GROQ_API_KEY, value: "{{ groq_api_key }}" }
        - { key: DEEPGRAM_API_KEY, value: "{{ deepgram_api_key }}" }
        - { key: GEMINI_API_KEY, value: "{{ gemini_api_key }}" }
        # GitHub App „momo-bot" — nur schreiben, wenn gesetzt (sonst leer lassen).
        # Der Private Key kommt NICHT in .env; er liegt auf dem Host unter
        # ~/.secrets/momo-bot.pem und wird per docker-compose gemountet.
        - { key: GH_APP_ID, value: "{{ gh_app_id }}" }
        - { key: GH_APP_INSTALLATION_ID, value: "{{ gh_app_installation_id }}" }
        - { key: GH_APP_PRIVATE_KEY_FILE, value: "/home/node/.secrets/momo-bot.pem" }

    - name: Provision webhook token (if DEPLOY_TOKEN is set)
      ansible.builtin.copy:
        content: "{{ deploy_token }}\n"
        dest: "{{ deploy_dir }}/webhook-token"
        mode: "0600"
      no_log: true
      when: deploy_token | length > 0

    # ── Docker Compose ────────────────────────────────────────────

    - name: Pull images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ deploy_dir }}"
      changed_when: false

    - name: Start containers
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ deploy_dir }}"
      changed_when: false

    - name: Wait for gateway to be healthy
      ansible.builtin.uri:
        url: http://127.0.0.1:18789/healthz
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 2

    # ── Install DeepSeek provider plugin ──────────────────────────

    - name: Install DeepSeek provider plugin
      ansible.builtin.command:
        cmd: docker compose exec -T -u node openclaw openclaw plugins install @openclaw/deepseek-provider
        chdir: "{{ deploy_dir }}"
      register: plugin_install
      changed_when: false
      failed_when:
        - plugin_install.rc != 0
        - "'already installed' not in plugin_install.stderr"

    - name: Restart OpenClaw to load plugin
      ansible.builtin.command:
        cmd: docker compose restart openclaw
        chdir: "{{ deploy_dir }}"
      changed_when: true

    - name: Wait for gateway after restart
      ansible.builtin.uri:
        url: http://127.0.0.1:18789/healthz
        status_code: 200
      register: health2
      until: health2.status == 200
      retries: 30
      delay: 2

    # ── Caddy reverse proxy ───────────────────────────────────────

    - name: Clean up any old openclaw Caddy blocks
      ansible.builtin.shell: |
        sed -i '/^# BEGIN ANSIBLE OPENCLAW/,/^# END ANSIBLE OPENCLAW/d' ~/caddy/Caddyfile
        sed -i '/^openclaw.simonklimke.de {/,/^}/d' ~/caddy/Caddyfile
      changed_when: false

    - name: Add openclaw block to Caddyfile
      ansible.builtin.blockinfile:
        path: ~/caddy/Caddyfile
        marker: "# {mark} ANSIBLE OPENCLAW"
        insertafter: EOF
        block: |
          openclaw.simonklimke.de {
              reverse_proxy openclaw:18789
              encode gzip
          }

    - name: Add deploy webhook block to Caddyfile
      ansible.builtin.blockinfile:
        path: ~/caddy/Caddyfile
        marker: "# {mark} ANSIBLE OPENCLAW WEBHOOK"
        insertafter: EOF
        block: |
          deploy.openclaw.simonklimke.de {
              reverse_proxy 192.168.178.149:18791
              encode gzip
          }

    - name: Add cost dashboard block to Caddyfile
      ansible.builtin.blockinfile:
        path: ~/caddy/Caddyfile
        marker: "# {mark} ANSIBLE OPENCLAW COST"
        insertafter: EOF
        block: |
          cost.openclaw.simonklimke.de {
              reverse_proxy oauth2-proxy-cost:4180
              encode gzip
          }

          :9092 {
              root * /srv/cost
              file_server
          }

    # ── DNS ───────────────────────────────────────────────────────

    - name: Add domain to home_domains.txt
      ansible.builtin.lineinfile:
        path: ~/home_domains.txt
        line: openclaw.simonklimke.de
        state: present

    - name: Add cost domain to home_domains.txt
      ansible.builtin.lineinfile:
        path: ~/home_domains.txt
        line: cost.openclaw.simonklimke.de
        state: present

    # ── Reload Caddy ──────────────────────────────────────────────

    - name: Reload Caddy
      ansible.builtin.command:
        cmd: docker exec caddy-caddy-1 caddy reload --config /etc/caddy/Caddyfile
      changed_when: true

    # ── Summary ───────────────────────────────────────────────────

    - name: Print gateway token
      ansible.builtin.debug:
        msg:
          - "✅ OpenClaw deployed!"
          - "🌐 https://openclaw.simonklimke.de"
          - ""
          - "Pair Telegram: DM @momomemos_bot → get code →"
          - "  ssh momo@192.168.178.149 docker exec openclaw openclaw pairing approve telegram <CODE>"
          - ""
          - "Deploy webhook: https://deploy.openclaw.simonklimke.de/deploy (Bearer webhook-token)"

  handlers:
    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes
