# Native OpenClaw Gateway — .149, Admin-Zugriff ausschließlich über Tailscale.
# `lan` ist ein ssh_config-Alias (siehe ../ssh_config) → Tailscale 100.85.52.13.
# Ansible löst ssh_config-Aliase NICHT zuverlässig selbst auf, deshalb wird die
# IP hier explizit als ansible_host gesetzt (mesh-first, keine Public-IP).
[openclaw]
lan ansible_host=100.85.52.13 ansible_user=momo
