name: openclaw

services:
  # ── Obsidian Sync: headless client syncing quill_data ───────────
  obsidian-sync:
    image: ghcr.io/momokli/openclaw-obsidian-sync:latest
    container_name: openclaw-obsidian-sync
    restart: unless-stopped

    environment:
      - TZ=Europe/Berlin
      # Credentials (auth token) live here, inside the persistent volume.
      - XDG_CONFIG_HOME=/config

    volumes:
      - obsidian_config:/config
      - /opt/apps/quill:/data/quill

  # ── OpenClaw: AI agent gateway ─────────────────────────────────
  openclaw:
    image: ghcr.io/momokli/openclaw-deploy:latest
    container_name: openclaw
    restart: unless-stopped

    ports:
      - "127.0.0.1:18789:18789"

    volumes:
      # Git-tracked config (read-only source of truth)
      - ./config:/openclaw-config:ro
      - ./workspace:/openclaw-config/workspace:ro
      # Runtime state (named volumes — NOT in git)
      - openclaw_home:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      # Read-only mounts
      - /opt/apps/lab:/lab:ro
      - /opt/apps/quill:/quill
      - ${HOME}/.ssh/id_ed25519:/home/node/.ssh/id_ed25519:ro
      # GitHub App „momo-clanker" Private Key — App-Auth (MODE A), aktiviert 2026-08-31.
      # Host-Secrets-Verzeichnis read-only gemountet: GitHub lädt App-Keys als
      # „<app-slug>.<datum>.private-key.pem" herunter, daher Verzeichnis-Mount statt
      # Einzeldatei. generate-github-token.sh nutzt GH_APP_PRIVATE_KEY_FILE und fällt
      # auf die neueste *.pem im Verzeichnis zurück (siehe SETUP.md). chmod 600 der
      # Host-Datei bleibt erhalten (uid 1000: momo auf dem Host == node im Container).
      - ${HOME}/.secrets:/home/node/.secrets:ro
      - repos:/home/node/repos

    env_file:
      - ./config/.env

    environment:
      - OPENCLAW_GATEWAY_BIND=lan
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=true
      - TZ=Europe/Berlin

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - default
      - caddy

  # ── Ollama: self-hosted embedding provider (memory search) ─────
  ollama:
    image: ollama/ollama:latest
    container_name: openclaw-ollama
    restart: unless-stopped

    # Tuning (CPU-only, kein GPU): das Modell resident halten (kein
    # Entlade-/Lade-Latency zwischen Memory-Searches) und mehrere parallele
    # Embedding-Anfragen zulassen, damit parallele Chats nicht hinter dem
    # einzelnen Default-Slot serialisieren.
    environment:
      - OLLAMA_KEEP_ALIVE=-1        # Modell nie entladen (default: 5m → Reload-Latenz)
      - OLLAMA_MAX_LOADED_MODELS=1  # nur das Embedding-Modell resident
      - OLLAMA_NUM_PARALLEL=4       # parallele Slots statt 1 (Default bei CPU)

    # CPU-Limit: weniger Threads = weniger Sync-Overhead für das winzige
    # nomic-embed-text-Modell (E5-2650 v2, kein AVX2). Go/llama.cpp respektiert
    # das cgroup-Limit und nutzt entsprechend weniger Threads statt aller 16 vCPUs.
    deploy:
      resources:
        limits:
          cpus: '8.0'

    volumes:
      - ollama_models:/root/.ollama
    networks:
      - default

networks:
  caddy:
    external: true
    name: caddy_default

volumes:
  repos:
    name: openclaw_repos
  openclaw_home:
    name: openclaw_home
  openclaw_workspace:
    name: openclaw_workspace
  obsidian_config:
  ollama_models:
    name: openclaw_ollama_models
