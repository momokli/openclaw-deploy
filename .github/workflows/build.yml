name: Build & Push Images

# CI läuft für JEDEN Pull Request (alle Base-Branches) und für Pushes auf main,
# damit vor dem Merge sichtbar ist, ob der Build grün ist.
# Push-Trigger nur auf main, damit PR-Branch-Pushes nicht doppelt feuern
# (push + pull_request) — auf PR-Branches läuft nur der pull_request-Run.
# GHCR-Push + Deploy-Webhook sind weiterhin per `if: github.ref == 'refs/heads/main'`
# auf main beschränkt.
# Status-Check-Referenz für Branch Protection auf main: Job-Name "build".
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

env:
  IMAGE: ghcr.io/momokli/openclaw-deploy
  OBSIDIAN_IMAGE: ghcr.io/momokli/openclaw-obsidian-sync

jobs:
  build:
    runs-on: self-hosted
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build openclaw image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Test openclaw image (entrypoint + tools present)
        run: |
          docker run --rm $IMAGE:${{ github.sha }} which cargo rustc ansible gh himalaya

      - name: Build obsidian-sync image
        run: docker build -f Dockerfile.obsidian-sync -t $OBSIDIAN_IMAGE:${{ github.sha }} .

      # Only push to GHCR on main (not on PRs)
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push openclaw to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Push obsidian-sync to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $OBSIDIAN_IMAGE:${{ github.sha }} $OBSIDIAN_IMAGE:latest
          docker push $OBSIDIAN_IMAGE:${{ github.sha }}
          docker push $OBSIDIAN_IMAGE:latest

      # Trigger deploy on .149 via HTTPS webhook (no Tailscale/SSH).
      # The webhook validates DEPLOY_TOKEN and starts openclaw-build.service.
      # Webhook is async on .149: answers immediately with 202, hence --max-time 30.
      - name: Trigger deploy on .149
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: |
          curl -fsS --max-time 30 -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://deploy.openclaw.simonklimke.de/deploy
