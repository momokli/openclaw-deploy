# Runner-Profil — momos-music-manager (Runner A/B).
#
# Wird von scripts/runner-profile.sh gesourct. NUR Defaults: `:=` überschreibt
# keine bereits gesetzte Umgebungsvariable.

# Repo + Identität.
: "${RUNNER_REPO:=momokli/momos-music-manager}"
: "${RUNNER_STATE_PREFIX:=mmm}"       # Decision-/Marker-/Status-Namen, Log-Tag
: "${RUNNER_A_GH:=clanker-gh}"        # Runner A = momo-clanker[bot]
: "${RUNNER_B_GH:=claw-gh}"           # Runner B = momo-claw[bot]

# Automation-Jobs (Trigger-Ziel + Dedup-Key).
: "${RUNNER_TRIAGE_KEY:=mmm-triage:main}"
: "${RUNNER_GATE_KEY:=mmm-pr-gate:main}"
: "${RUNNER_TICK_LOG:=/srv/openclaw/logs/mmm-tick.log}"

# Fokus-Milestone: der freigegebene Milestone (Freigabe-Zeile im Milestone-Text).
# Kein Versions-Titel-Filter mehr — die Roadmap ist multi-strand (hub-*, music-api-*, …).
# Optionaler Include-Filter (Regex auf den Titel); leer = alle offenen Milestones.
: "${RUNNER_FOCUS_PATTERN:=}"
: "${RUNNER_APPROVE_RE:=(?im)^[ \t]*freigabe[ \t]*:[ \t]*(ja|yes|true)[ \t]*$}"

# Labels (Zustandsmaschine). HOLD = „nicht dispatchbar" (Leaf-Gate).
# Unterschied zu rift: MMM markiert manuelle Tests als `needs:manual-test`.
: "${RUNNER_DISPATCH_LABEL:=orchestrator:dispatched}"
: "${RUNNER_REDISPATCH_LABEL:=triage:redispatch}"
: "${RUNNER_BLOCKED_LABEL:=question}"
: "${RUNNER_RELEASE_LABEL:=release:auto}"
# 0 = kein `[Release]`-Tracking-Issue (MMM: Tag-Push ist der Release, der PR schliesst nichts).
: "${RUNNER_RELEASE_TRACKING_ISSUE:=0}"
: "${RUNNER_HOLD_LABELS:=claimed needs:manual-test follow-up hold question triage:no-action}"

# Label für „manuell zu testen" (Release-Testplan) — eine Teilmenge von HOLD_LABELS.
: "${RUNNER_MANUAL_TEST_LABEL:=needs:manual-test}"

# Worker-Orchestratoren (Stale-Guard liest deren Sessions).
: "${RUNNER_WORKER_AGENTS:=coding-orchestrator planning-orchestrator}"

# Repo-spezifische Release-Hinweise — der Tick schreibt sie in die
# <prefix>-release-decision.md, der Gate-Turn liest sie (Abnahme + Testplan).
: "${RUNNER_RELEASE_HINT:=- CHANGELOG-Abschnitt im Keep-a-Changelog-Stil (MMM-Format), nur aus Daten: geschlossene Milestone-Issues + gemergte PRs.
- Versions-Bump: die Cargo.toml der Komponente (music-hub/ | music-api/ | kellner/). Release-Tag (component-vX.Y.Z, hub-/api-/kellner-), gepusht vom Gate (Tag-Push = Release). Kein Root-Cargo.toml/site/Autoupdater.
- Kein boot-test/high-prio-Kriterium; Abnahmebelege aus Tests + manuellen Checks der geaenderten Pfade.
- Testplan: manuelle Checks zuerst aus den needs:manual-test-Issues.}"
