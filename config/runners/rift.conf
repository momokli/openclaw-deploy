# Runner-Profil — riftbreaker-battle-mod (Runner A/B).
#
# Wird von scripts/runner-profile.sh gesourct. NUR Defaults: `:=` überschreibt
# keine bereits gesetzte Umgebungsvariable — Tests und operative Overrides
# (z. B. RIFT_GH, RIFT_REPO) gewinnen weiterhin.

# Repo + Identität.
: "${RUNNER_REPO:=momokli/riftbreaker-battle-mod}"
: "${RUNNER_STATE_PREFIX:=rift}"      # Decision-/Marker-/Status-Namen, Log-Tag
: "${RUNNER_A_GH:=clanker-gh}"        # Runner A = momo-clanker[bot]
: "${RUNNER_B_GH:=claw-gh}"           # Runner B = momo-claw[bot]

# Automation-Jobs (Trigger-Ziel + Dedup-Key).
: "${RUNNER_TRIAGE_KEY:=rift-triage:main}"
: "${RUNNER_GATE_KEY:=rift-pr-gate:main}"
: "${RUNNER_TICK_LOG:=/srv/openclaw/logs/rift-tick.log}"

# Fokus-Milestone: Versions-Titel + Freigabe-Zeile im Milestone-Text.
: "${RUNNER_FOCUS_PATTERN:=^[0-9]+\.[0-9]+(\.[0-9]+)?$}"
: "${RUNNER_APPROVE_RE:=(?im)^[ \t]*freigabe[ \t]*:[ \t]*(ja|yes|true)[ \t]*$}"

# Labels (Zustandsmaschine). HOLD = „nicht dispatchbar" (Leaf-Gate).
: "${RUNNER_DISPATCH_LABEL:=orchestrator:dispatched}"
: "${RUNNER_REDISPATCH_LABEL:=triage:redispatch}"
: "${RUNNER_BLOCKED_LABEL:=question}"
: "${RUNNER_RELEASE_LABEL:=release:human-merge}"
# 1 = Repo führt ein `[Release]`-Tracking-Issue (der Release-PR schliesst es).
: "${RUNNER_RELEASE_TRACKING_ISSUE:=1}"
: "${RUNNER_HOLD_LABELS:=claimed needs:player-test follow-up hold question triage:no-action}"

# Label für „manuell zu testen" (Release-Testplan) — eine Teilmenge von HOLD_LABELS.
: "${RUNNER_MANUAL_TEST_LABEL:=needs:player-test}"

# Worker-Orchestratoren (Stale-Guard liest deren Sessions).
: "${RUNNER_WORKER_AGENTS:=coding-orchestrator planning-orchestrator}"

# Repo-spezifische Release-Hinweise — der Tick schreibt sie in die
# <prefix>-release-decision.md, der Gate-Turn liest sie (Abnahme + Testplan).
: "${RUNNER_RELEASE_HINT:=- CHANGELOG im Factorio-Stil (Version/Date + Kategorien, je eine Zeile + Issue-Nr.), nur aus Daten: geschlossene Milestone-Issues + gemergte PRs.
- Release-Tracking-Issue [Release] sicherstellen und mit einem Closing-Keyword (Closes #<n>) schliessen — der Required-Check verlangt das.
- Abnahme GLOBAL: Boot-Test = Wall-Time des ganzen boot-test-Jobs (durch den Path-Filter uebersprungen = nicht messbar, nicht gruen); high-prio-Bugs repo-weit auflisten. Nicht schoenreden.
- Testplan-Ziel: Staging (Server ueber den Proxy waehlen, nicht den Port).}"
